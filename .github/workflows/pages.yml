# Pubblica il sito su GitHub Pages (www.supplyville.com) ad ogni modifica del ramo main.
name: Sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # ogni 3 ore: prende l'ultima versione del gioco

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito
        run: mkdir site && cp -r index.html site.css site.js catalog.js img CNAME .nojekyll site/
      # Il gioco giocabile su www.supplyville.com/jugar/ (richiesta dell'utente): l'ultima versione dal
      # repository FlattFall/city-builder (pubblico), solo i file del gioco
      - uses: actions/checkout@v4
        with:
          repository: FlattFall/city-builder
          path: game
      - name: Copia il gioco in /jugar/
        run: mkdir -p site/jugar && cp -r game/index.html game/style.css game/js game/manifest.json game/icons site/jugar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
