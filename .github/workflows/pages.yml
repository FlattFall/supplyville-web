# Pubblica il sito su GitHub Pages (www.supplyville.com) ad ogni modifica del ramo main.
# Il gioco giocabile sta in jugar/ (richiesta dell'utente): sono i file del repository FlattFall/city-builder,
# copiati DENTRO questo repository (Pages qui pubblica anche direttamente dal ramo main, quindi jugar/ deve
# esserci nel ramo). Il job "gioco" li aggiorna ogni 3 ore (o a mano) e fa un commit se sono cambiati.
name: Sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'   # ogni 3 ore: prende l'ultima versione del gioco

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gioco:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FlattFall/city-builder
          path: game
      - name: Copia il gioco in jugar/
        run: |
          rm -rf jugar && mkdir jugar
          cp -r game/index.html game/style.css game/js game/manifest.json game/icons jugar/
          rm -rf game
      - id: commit
        name: Commit se il gioco è cambiato
        run: |
          git add jugar
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Gioco aggiornato in jugar/ (dal repository city-builder)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Ricostruisce Pages dal ramo
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

  deploy:
    needs: gioco
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepara i file del sito
        run: mkdir site && cp -r index.html site.css site.js catalog.js img jugar CNAME .nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
